name: Update GroundScout opportunities
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public procurement notices
        run: python scripts/update_opportunities.py
      - name: Commit updated opportunities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GroundScout tenders"
            git push
          fi
